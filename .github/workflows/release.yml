name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive_ext: tar.gz
            cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            archive_ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive_ext: tar.gz
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install cross
        if: matrix.cross == true
        run: cargo install cross --locked
      - name: Build (cross)
        if: matrix.cross == true
        run: cross build --release --workspace --target ${{ matrix.target }}
      - name: Build (native)
        if: matrix.cross != true
        run: cargo build --release --workspace --target ${{ matrix.target }} --locked
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tag=${GITHUB_REF#refs/tags/}
          name="wienerlog-${tag}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          for bin in wlog wlog-ingest-git wlog-ingest-cc wlog-ingest-gh; do
            cp "target/${{ matrix.target }}/release/${bin}" "dist/${name}/"
          done
          cp README.md LICENSE CHANGELOG.md "dist/${name}/"
          (cd dist && tar -czf "${name}.tar.gz" "${name}")
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate notes
        id: notes
        run: |
          set -euo pipefail
          tag=${GITHUB_REF#refs/tags/}
          prev=$(git tag --sort=-creatordate | grep -v "^${tag}$" | head -1 || true)
          {
            echo "## ${tag}"
            echo
            if [[ -n "${prev}" ]]; then
              echo "### Changes since ${prev}"
              git log --pretty=format:"- %s (%h)" "${prev}..${tag}"
            else
              echo "Initial release."
            fi
          } > NOTES.md
      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.tar.gz
          body_path: NOTES.md
          generate_release_notes: false
