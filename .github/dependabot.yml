version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 8
    commit-message:
      prefix: "chore(deps)"
      include: scope
    labels:
      - dependencies
      - rust
    groups:
      tokio-stack:
        patterns:
          - "tokio"
          - "tokio-*"
          - "tower"
          - "tower-*"
          - "hyper"
          - "hyper-*"
      tracing-stack:
        patterns:
          - "tracing"
          - "tracing-*"
      sqlx-stack:
        patterns:
          - "sqlx"
          - "sqlx-*"
          - "pgvector"
      serde-stack:
        patterns:
          - "serde"
          - "serde_*"
      test-stack:
        patterns:
          - "insta"
          - "mockall"
          - "proptest"
          - "testcontainers"
          - "testcontainers-*"
          - "pretty_assertions"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      day: monday
      time: "07:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 4
    commit-message:
      prefix: "ci(deps)"
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: docker
    directory: "/infra"
    schedule:
      interval: monthly
    commit-message:
      prefix: "build(deps)"
    labels:
      - dependencies
      - docker
