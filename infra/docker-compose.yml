name: wienerlog

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
    container_name: wlog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wlog
      POSTGRES_PASSWORD: wlog
      POSTGRES_DB: wlog
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wlog -d wlog"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
    container_name: wlog-nats
    restart: unless-stopped
    command:
      - "-js"
      - "-m"
      - "8222"
      - "--name"
      - "wlog-nats"
      - "--store_dir"
      - "/data"
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot migration runner. Activate with:
  #   docker compose -f infra/docker-compose.yml --profile init run --rm db-init
  # Idempotent: every CREATE/ALTER step in the migration is guarded.
  db-init:
    image: pgvector/pgvector:pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
    container_name: wlog-db-init
    profiles: ["init"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: wlog
      PGPASSWORD: wlog
      PGDATABASE: wlog
    volumes:
      - ../migrations:/migrations:ro
    entrypoint:
      - sh
      - -ec
      - |
        for f in $(ls /migrations/*.up.sql | sort); do
          echo "applying $$f"
          psql -v ON_ERROR_STOP=1 -f "$$f"
        done
        echo "db-init: ok"

volumes:
  postgres_data:
    name: wlog_postgres_data
  nats_data:
    name: wlog_nats_data
