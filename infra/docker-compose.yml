name: wienerlog

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: wlog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wlog
      POSTGRES_PASSWORD: wlog
      POSTGRES_DB: wlog
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wlog -d wlog"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    container_name: wlog-nats
    restart: unless-stopped
    command:
      - "-js"
      - "-m"
      - "8222"
      - "--name"
      - "wlog-nats"
      - "--store_dir"
      - "/data"
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    name: wlog_postgres_data
  nats_data:
    name: wlog_nats_data
