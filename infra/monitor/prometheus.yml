global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    cluster: wlog-prod

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: wlog-daemon
    metrics_path: /metrics
    static_configs:
      - targets: ["daemon:9789"]
        labels:
          service: daemon

  - job_name: wlog-web
    metrics_path: /metrics
    static_configs:
      - targets: ["web:8088"]
        labels:
          service: web

  - job_name: nats
    metrics_path: /metrics
    static_configs:
      - targets: ["nats:8222"]
        labels:
          service: nats

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          service: cadvisor

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: node
